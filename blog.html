<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水果小教室 · 果果家 KOKOYA</title>
<meta name="description" content="挑水果不踩雷的選果秘訣與保存技巧 · 果果家 KOKOYA">
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/shop.css">
<style>
  .blog-header {
    text-align: center;
    padding: 50px 22px 30px;
    background:
      radial-gradient(circle at 20% 30%, rgba(232,162,102,.12), transparent 60%),
      radial-gradient(circle at 80% 60%, rgba(168,184,158,.12), transparent 60%);
  }
  .blog-header h1 {
    font-size: 2.4rem;
    margin-bottom: 8px;
    letter-spacing: .15em;
  }
  .blog-header .lead {
    color: var(--ink-3);
    font-size: 1rem;
    letter-spacing: .12em;
  }
  .cat-filter {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    margin: 26px auto 0;
    max-width: 800px;
  }
  .cat-btn {
    padding: 7px 16px;
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    background: var(--paper);
    color: var(--ink-2);
    font-size: .9rem;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .cat-btn:hover { border-color: var(--orange); color: var(--orange-d); }
  .cat-btn.active {
    background: var(--orange);
    color: #fff;
    border-color: var(--orange);
  }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 22px;
    padding: 30px 0 60px;
  }
  .art-card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform .2s, box-shadow .25s;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
  }
  .art-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .art-card .cover {
    aspect-ratio: 16/10;
    background: linear-gradient(135deg, #FFEFD9, #FBE0C2);
    display: grid; place-items: center;
    font-size: 4.5rem;
    overflow: hidden;
    position: relative;
  }
  .art-card .cover img { width: 100%; height: 100%; object-fit: cover; }
  .art-card .cover .cat-tag {
    position: absolute;
    top: 12px; left: 12px;
    background: var(--orange);
    color: #fff;
    padding: 4px 12px;
    border-radius: var(--r-pill);
    font-size: .76rem;
    letter-spacing: .08em;
  }
  .art-card .body { padding: 16px 18px; flex: 1; display: flex; flex-direction: column; }
  .art-card h3 {
    font-size: 1.1rem;
    margin-bottom: 8px;
    color: var(--ink-1);
    line-height: 1.5;
    font-family: "Noto Serif TC", serif;
  }
  .art-card .excerpt {
    font-size: .88rem;
    color: var(--ink-3);
    line-height: 1.65;
    flex: 1;
  }
  .art-card .read-more {
    margin-top: 12px;
    font-size: .84rem;
    color: var(--orange-d);
    font-weight: 600;
  }
</style>
</head>
<body id="top">

<header class="topbar">
  <div class="inner">
    <a href="index.html" class="brand">
      <img src="assets/logo.png" alt="果果家">
      <div>
        果果家
        <span class="en">KOKOYA</span>
      </div>
    </a>
    <nav class="nav" id="mainNav">
      <a href="index.html">首頁</a>
      <a href="index.html#season">當季水果</a>
      <a href="index.html#products">水果禮盒</a>
      <a href="blog.html" class="active">水果小教室</a>
      <a href="index.html#brand">品牌故事</a>
      <a href="my-orders.html">我的訂單</a>
    </nav>
    <button class="menu-toggle" id="menuToggle" aria-label="選單">☰</button>
    <div id="authSlot" class="auth-slot"></div>
    <a href="index.html" class="cta-buy">🍎 去逛逛</a>
  </div>
</header>

<section class="blog-header">
  <div class="container">
    <h1>📚 水果小教室</h1>
    <p class="lead">挑水果不踩雷 · 保存有訣竅 · 吃出最甜美的味道</p>
    <div class="cat-filter" id="catFilter">
      <button class="cat-btn active" data-cat="">全部</button>
      <!-- JS 會動態填入分類 -->
    </div>
  </div>
</section>

<main class="container">
  <div class="articles-grid" id="articleList">
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">
      載入中…
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="copy">© 2026 果果家 KOKOYA. All Rights Reserved.</div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script type="module">
  import { db, collection, query, orderBy, getDocs } from "./js/firebase-shop.js";
  import { renderAuthButton } from "./js/auth.js";

  const $ = id => document.getElementById(id);

  let articles = [];
  let curCat = "";

  async function load() {
    try {
      const snap = await getDocs(query(collection(db, "articles"), orderBy("order", "asc")));
      articles = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(a => a.published !== false);
      renderCats();
      render();
    } catch (err) {
      console.error("載入文章失敗", err);
      $("articleList").innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--ink-3)">
          <div style="font-size:3rem">😢</div>
          載入失敗：${err.message}<br>
          <span style="font-size:.84rem;color:var(--muted)">（管理員可能還沒在後台建立文章）</span>
        </div>`;
    }
  }

  function renderCats() {
    const cats = [...new Set(articles.map(a => a.category).filter(Boolean))];
    const $bar = $("catFilter");
    $bar.innerHTML = `<button class="cat-btn active" data-cat="">全部 (${articles.length})</button>` +
      cats.map(c => {
        const cnt = articles.filter(a => a.category === c).length;
        return `<button class="cat-btn" data-cat="${c}">${c} (${cnt})</button>`;
      }).join("");
    $bar.querySelectorAll(".cat-btn").forEach(b => {
      b.addEventListener("click", () => {
        $bar.querySelectorAll(".cat-btn").forEach(x => x.classList.remove("active"));
        b.classList.add("active");
        curCat = b.dataset.cat;
        render();
      });
    });
  }

  function render() {
    let list = articles;
    if (curCat) list = list.filter(a => a.category === curCat);

    if (!list.length) {
      $("articleList").innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">
          <div style="font-size:3rem">🍃</div>
          ${curCat ? `「${curCat}」分類目前沒有文章` : "目前沒有文章"}
        </div>`;
      return;
    }

    $("articleList").innerHTML = list.map(a => {
      const cover = a.cover
        ? `<img src="${a.cover}" alt="${a.title}" onerror="this.parentElement.innerHTML='<span style=&quot;font-size:4.5rem&quot;>${a.icon||'📚'}</span>'+this.parentElement.querySelector('.cat-tag').outerHTML">`
        : `<span>${a.icon || "📚"}</span>`;
      const slug = a.slug || a.id;
      return `
        <a class="art-card" href="blog-detail.html?slug=${encodeURIComponent(slug)}">
          <div class="cover">
            ${a.category ? `<span class="cat-tag">${a.category}</span>` : ""}
            ${cover}
          </div>
          <div class="body">
            <h3>${a.title || "(無標題)"}</h3>
            <div class="excerpt">${a.excerpt || ""}</div>
            <div class="read-more">閱讀全文 →</div>
          </div>
        </a>`;
    }).join("");
  }

  // 漢堡選單
  $("menuToggle")?.addEventListener("click", () => $("mainNav").classList.toggle("show"));

  renderAuthButton($("authSlot"));
  load();
</script>
</body>
</html>
